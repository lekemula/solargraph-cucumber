name: Ruby

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Tests (ruby v${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this same as https://github.com/castwide/solargraph/blob/master/.github/workflows/rspec.yml
        ruby-version: ['3.1', '3.2', '3.3', '3.4', '4.0']

    steps:
      - name: Checkout solargraph-cucumber
        uses: actions/checkout@v4

      # Without a local checkout, the Gemfile takes solargraph from the cucumber branch of
      # lekemula/solargraph (castwide/solargraph#1489)
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run tests
        run: bundle exec rspec --format progress
